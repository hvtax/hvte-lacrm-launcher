name: Release Firefox add-on
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firefox-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Guard repository, update URL, clean source, and new version
        run: node tools/release.mjs guard
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Sign through AMO unlisted channel
        run: npm run sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Prepare stable asset and update manifest with SHA-256
        run: node tools/release.mjs prepare
      - name: Publish release and commit update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./manifest.json').version")
          asset="web-ext-artifacts/hvte-lacrm-launcher-${version}.xpi"
          # Do not overwrite a release or change an existing tag on retry.
          git fetch origin --tags
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Release tag already exists; stop and ask the owner."
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          gh release create "v${version}" "$asset" --target "$source_commit" --title "HVTE LACRM Launcher ${version}" --notes-file CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "release: publish update feed for v${version}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          {
            echo "Version: ${version}"
            echo "Release: https://github.com/hvtax/hvte-lacrm-launcher/releases/tag/v${version}"
            echo "Updates: https://hvtax.github.io/hvte-lacrm-launcher/updates.json"
            echo "Wait for the Pages deployment, then verify both URLs anonymously."
          } >> "$GITHUB_STEP_SUMMARY"
